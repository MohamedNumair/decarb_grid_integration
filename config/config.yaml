# ============================================================
# Building-Grid Integration Pipeline Configuration
# ============================================================
# This file controls all pipeline parameters. Copy it, edit for
# your scenario, and pass the path to run_pipeline.py.
# ============================================================

# --- Date Range ---
# Simulation period for the DECARB inputs (tm.csv) and the network inputs
# built from DECARB results. Preprocessing always uses the full year.
# Dates are "Mon DD" strings.
# If start is AFTER end the window wraps around the new year
# (e.g. start: "Dec 1", end: "Feb 28" → Dec + Jan + Feb).
date_range:
  start: "Jan 1"
  end: "Dec 31"

# --- Timestep ---
# Resolution of everything from DECARB onward: tm.csv, the thermal coefficients
# in bdg_ii.csv (converted from the 15-min fit), and the OpenDSS cases and
# interpolation built from a study. Preprocessing is always 15-min (ResStock).
# Each study keeps a copy of this file, so network-inputs uses the timestep the
# study was generated with. (GenX demand is still hourly-only.)
timestep: "hourly"            # "hourly" or "15min"

# --- Scope ---
# "statewide" = all of Texas, GenX capacity expansion analysis
#               NOTE: statewide is NOT up to date. It has not been maintained
#               alongside the zone workflow and will be reworked for a GenX
#               transmission analysis. Use "zone".
# "zone"      = single zone, OpenDSS distribution analysis
scope: "zone"

# --- Zone Settings (only used when scope = "zone") ---
zone:
  name: "P101U"               # zone to analyze

# --- Test Mode ---
# When true, limits downloads and processing to a small subset
test_mode: true
test_limit: 600              # max buildings in the candidate pool (ignored when test_mode=false)

# --- State & Geography ---
state: "NY"
state_full: "New York"
year: 2018
timezone: "America/New_York"  # IANA time zone of the buildings' timestamps; used for the
                              # solar position when sizing rooftop PV orientation
                              # (e.g. "America/Chicago" for TX, "America/New_York" for MA)

# --- Paths (relative to this config file's directory) ---
paths:
  project_root: ".."
  input_dir: "../in"
  output_dir: "../out"
  network_dir: "../in/smartds"   # SMART-DS feeder network, downloaded per zone
  county_shapefile: "../in/us_county_boundaries/us-county-boundaries.shp"

# --- ResStock / OEDI Data ---
resstock:
  release: "resstock_amy2018_release_1"
  release_year: 2025
  s3_bucket: "oedi-data-lake"

# --- SMART-DS distribution network (public OEDI bucket) ---
smartds:
  s3_bucket: "oedi-data-lake"
  s3_prefix: "SMART-DS/v0.9/2018/Full_Texas"

# --- Data Acquisition (only used when stages.data_acquisition: true) ---
data_acquisition:
  download_workers: 16              # parallel downloads (ResStock profiles, network, profiles)
  download_network: true            # download the SMART-DS feeder .dss files for the zone(s)
                                    # into paths.network_dir (files already there are skipped)
  download_network_profiles: false  # download the SMART-DS kw + kvar loadshape profiles referenced
                                    # by the feeders; not used by the OpenDSS cases network-inputs builds

# --- Matching ---
matching:
  usage_limit: auto            # max times a building can be matched (integer, or "auto" — see usage_multiplier)
  usage_multiplier: 15         # used when usage_limit = "auto":
                               #   usage_limit = ceil(usage_multiplier × n_buses / n_buildings)
                               # n_buses/n_buildings is the reuse an even spread needs; the multiplier
                               # lets a well-matching building be reused up to that many times more

# --- Schedule & Setpoint Settings ---
schedules:
  method: "history"           # "history" = from consumption data (indoor vs outdoor temp)
                              # "metadata" = from ResStock metadata (setpoint offset fields)
  resolution: "15min"         # timeseries resolution
  hysteresis:                 # only used by history method
    heat_enter: 0.80
    heat_exit: 0.70
    cool_enter: 0.20
    cool_exit: 0.30
    smoothing_days: 28

# --- Pipeline Stage Toggles ---
stages:
  data_acquisition: true
  thermal_model: true
  feeder_processing: true
  building_matching: true
  schedules: true
  heatpump_selection: true

# --- Heat Pump Selection ---
heatpump:
  neep_database: null         # path to NEEP CSV/Excel, relative to this file (null = input_dir/neep_database.csv)
  sizing_percentile: 95       # percentile of nonzero load for sizing
  max_units: 10               # max identical units to try if single unit insufficient
